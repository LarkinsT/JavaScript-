<html>
<head>
    <title>Question 5</title>
</head>
<body>
    <input id = "balance" type = "number" value = "0">
    <input id = "interest" type = "number" value = "0">
    <input id = "reach" type = "number" value = "0">
    <button onclick = "calculate()">Calculate</button>
    <p id = "result"></p>
    <script>
        function calculate() {
            alert("cheese")
            let balance = document.getElementById("balance").value;
            let interest = document.getElementById("interest").value;
            let reach = document.getElementById("reach").value;
            let years = 0;
            document.write("£" + String(balance) + " starting balance - " + String(interest) + "% interest rate<br>");
            while (balance < reach){
                balance = Number(balance) + (Number(balance) * Number(interest)/100);
                years += 1;
                document.write("Year " + String(years) + ": £" + String(balance) + "<br>");
            }
            document.getElementById("result").innerHTML = "It will take " + String(years) + " years to reach the balance you want.";
        }
    </script>
</body>
</html>
